name: Generate Shopify Business Report

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional local report date (YYYY-MM-DD); defaults to yesterday"
        required: false
        type: string
  schedule:
    # 07:00 Asia/Karachi (UTC+5). GitHub Actions cron is UTC.
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: shopify-business-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r shopify_automation/requirements.txt

      - name: Generate Shopify report
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION || '2025-10' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://openrouter.ai/api/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o-mini' }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'Asia/Karachi' }}
          LOW_STOCK_THRESHOLD: ${{ vars.LOW_STOCK_THRESHOLD || '10' }}
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            python -m shopify_automation --report-date "${{ inputs.report_date }}" --output-dir shopify_reports
          else
            python -m shopify_automation --output-dir shopify_reports
          fi

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shopify_reports/
          if git diff --cached --quiet; then
            echo "No Shopify report changes to commit."
          else
            git commit -m "chore: update Shopify business report"
            git push
          fi
