name: Generate Executive Briefing

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Karachi (UTC+5). GitHub Actions cron is always UTC.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: executive-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Create temporary Google token file
        env:
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "GOOGLE_ACCESS_TOKEN": os.environ.get("GOOGLE_ACCESS_TOKEN"),
              "GOOGLE_REFRESH_TOKEN": os.environ.get("GOOGLE_REFRESH_TOKEN"),
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_CLIENT_ID"),
              "GOOGLE_CLIENT_SECRET": os.environ.get("GOOGLE_CLIENT_SECRET"),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          token_path = Path.home() / ".openclaw" / "secrets" / "google-workspace-token.json"
          token_path.parent.mkdir(parents=True, exist_ok=True)
          token_path.write_text(json.dumps({
              "token": required["GOOGLE_ACCESS_TOKEN"],
              "refresh_token": required["GOOGLE_REFRESH_TOKEN"],
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": required["GOOGLE_CLIENT_ID"],
              "client_secret": required["GOOGLE_CLIENT_SECRET"],
              "scopes": [
                  "https://www.googleapis.com/auth/calendar.readonly",
                  "https://www.googleapis.com/auth/gmail.readonly",
                  "https://www.googleapis.com/auth/drive.readonly",
              ],
          }, indent=2), encoding="utf-8")
          print("Temporary Google token file created.")
          PY

      - name: Generate briefing
        run: python workspace_briefing.py

      - name: Commit generated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings/
          if git diff --cached --quiet; then
            echo "No briefing changes to commit."
          else
            git commit -m "chore: update executive workspace briefing"
            git push
          fi
